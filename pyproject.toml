[project]
name = "mountain-performance-analysis"
version = "0.0.1"
description = "Analyse de données de sport de montagne et modélisation de la performance."
readme = "README.md"
requires-python = ">=3.12"
# Aucune dépendance de calcul au jalon M0 : c'est de l'outillage, pas du métier.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mountain_perf"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.12",
    "mypy>=1.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
