[project]
name = "mountain-performance-analysis"
version = "0.0.1"
description = "Analyse de données de sport de montagne et modélisation de la performance."
readme = "README.md"
requires-python = ">=3.12"
# Aucune dépendance de calcul. tzdata donne à zoneinfo la base de fuseaux qui manque
# sous Windows (calendrier de Paris du backtest, brief M4a-1 § 4.4) ; sous Linux, la
# base du système suffit.
dependencies = ["tzdata; sys_platform == \"win32\""]

[project.scripts]
mperf = "mountain_perf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mountain_perf"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.12",
    "mypy>=1.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle — erreurs
    "W",   # pycodestyle — avertissements
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # règles propres à ruff
    "PT",  # flake8-pytest-style
]
# RUF001-003 restent actives : elles attrapent les homoglyphes (un « а » cyrillique
# dans un identifiant, une espace insécable dans une chaîne), vrai risque dans du
# code. On n'exempte que la typographie française et mathématique voulue dans les
# docstrings et commentaires.
allowed-confusables = ["×", "−", "’", "…", "–"]

[tool.mypy]
# Strict sur src/ (exigence du projet). tests/ passe aussi : pytest et hypothesis
# sont typés, le coût est nul et ça attrape les coquilles de fixtures.
files = ["src", "tests", "scripts"]
# tests/ n'est pas un paquet : ses modules partagés (`strategies`, `fixtures.routes`)
# s'importent comme sous pytest. Sans ces racines explicites, mypy voit
# `fixtures/routes.py` à la fois comme `routes` et `fixtures.routes`.
mypy_path = "$MYPY_CONFIG_FILE_DIR/src,$MYPY_CONFIG_FILE_DIR/tests"
explicit_package_bases = true
python_version = "3.12"
strict = true
warn_unreachable = true
