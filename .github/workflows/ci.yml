# CI : `just check` sur une machine vierge, sans accès aux données personnelles.
# Elle ne peut être verte que si le code ne dépend d'aucun fichier privé.
#
# Deux temps (docs/decisions/0011) : d'abord sans aucun extra, comme un `mperf`
# installé seul (les tests qui lisent des FIT, écrivent du Parquet ou ouvrent
# l'interface se sautent, par `pytest.importorskip("fitdecode")`,
# `pytest.importorskip("pyarrow")` et `pytest.importorskip("streamlit")`) ; puis toute
# la suite, et les types, avec tous les extras.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-uv ne publie pas de tag majeur flottant (pas de `v10`) : épingler
      # la version exacte.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Installer les dépendances (verrouillées, sans extra)
        run: uv sync --locked

      - name: Installer just
        run: |
          uv tool install rust-just
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: just check, sans extra
        run: just check

      - name: Tests, avec tous les extras (verrouillés)
        run: uv run --locked --all-extras pytest

      # Les types de ui/ contre ceux de Streamlit, absent de l'étape 1 (M5, 0016).
      - name: Types, avec tous les extras (verrouillés)
        run: uv run --locked --all-extras mypy
